# =============================================================================
# Netlify deployment configuration for Pilot Prospector
# =============================================================================

[build]
  command  = "npm run build"
  publish  = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

# The app is a Single Page Application: React handles the URLs, not the server.
# Without this rule, refreshing on /admin/leads would show a 404.
# API routes are excluded so they reach the functions instead.
[[redirects]]
  from = "/api/*"
  to   = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to   = "/index.html"
  status = 200

# -----------------------------------------------------------------------------
# Security headers
# -----------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(self), camera=(), microphone=(), payment=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
